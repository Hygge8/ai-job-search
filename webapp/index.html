<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Job Search Web</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1117;--panel:#171b23;--panel2:#1f2530;--line:#303846;--text:#eef3f8;--muted:#aab4c2;--blue:#7dd3fc;--green:#86efac;--red:#fca5a5;--yellow:#fde68a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17233a 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{padding:24px 18px;border-right:1px solid var(--line);background:rgba(17,20,27,.94);position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800}.sub,.muted{color:var(--muted)}.sub{font-size:12px;margin:5px 0 24px}.nav{display:grid;gap:8px}.nav button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer}.nav button{text-align:left;background:transparent;border-color:transparent}.nav button.active{background:var(--panel2);border-color:var(--line)}.btn.primary{background:var(--blue);color:#092234;border-color:transparent;font-weight:750}.btn.good{background:var(--green);color:#08251b;border-color:transparent;font-weight:750}.btn:disabled{opacity:.5;cursor:not-allowed}.status{position:absolute;left:18px;right:18px;bottom:20px;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12px;line-height:1.6}main{width:min(1320px,100%);margin:auto;padding:30px}.head{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}h1{margin:0 0 6px;font-size:28px}.card{background:linear-gradient(180deg,rgba(31,37,48,.96),rgba(23,27,35,.96));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.half{grid-column:span 6}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}.field{display:grid;gap:7px;margin-bottom:13px}label{font-size:13px;color:var(--muted)}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0e131a;color:var(--text);padding:11px 12px;outline:none}textarea{min-height:190px;resize:vertical;line-height:1.55}#profileText{min-height:560px}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{margin-top:10px;color:var(--muted);font-size:13px}.error{color:var(--red);white-space:pre-wrap}.success{color:var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#0c1016;border:1px solid var(--line);border-radius:12px;padding:15px;max-height:680px;overflow:auto;line-height:1.5}.job,.step,.history{border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(12,16,22,.52);margin-top:10px}.jobtop{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:5px}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:22px minmax(0,1fr);margin:0}.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:#596273}.step.completed .dot{background:var(--green)}.step.running .dot{background:var(--blue);box-shadow:0 0 0 5px rgba(125,211,252,.12)}.step.failed .dot{background:var(--red)}.step.waiting .dot{background:var(--yellow)}.artifact{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.artifact:last-child{border:0}[hidden]{display:none!important}.login{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,6,9,.82);backdrop-filter:blur(10px);z-index:20}.loginbox{width:min(420px,calc(100vw - 30px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.status{position:static;margin-top:14px}.half,.s3,.s6{grid-column:span 12}main{padding:18px 13px}}
  </style>
</head>
<body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><h2>登录 AI Job Search</h2><p class="muted">账号由 WEB_USERNAME / WEB_PASSWORD 配置。</p><div class="field"><label>用户名</label><input id="loginUser" value="admin" autocomplete="username"></div><div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary">登录</button><div id="loginMsg" class="notice error"></div></form></div>
<div class="shell">
  <aside class="side"><div class="brand">AI Job Search</div><div class="sub">完整网页版 /apply · 密钥仅保存在服务端</div><div class="nav"><button class="active" data-page="profile">候选人档案</button><button data-page="search">岗位搜索</button><button data-page="apply">完整 /apply</button><button data-page="history">历史记录</button></div><div id="sys" class="status">正在读取系统状态…</div></aside>
  <main>
    <div class="head"><div><h1 id="pageTitle">候选人档案</h1><div id="pageSub" class="muted">编辑并保存用于所有匹配和申请的真实资料。</div></div><button id="logout" class="btn">退出</button></div>
    <section id="page-profile" class="page"><div class="card"><h2>个人资料</h2><div class="field"><label>Markdown 候选人档案</label><textarea id="profileText"></textarea></div><div class="actions"><button id="saveProfile" class="btn primary">保存档案</button><button id="importProfile" class="btn">从 Claude Code 档案导入</button></div><div id="profileMsg" class="notice"></div></div></section>
    <section id="page-search" class="page" hidden><div class="card"><h2>搜索公开岗位</h2><div class="row"><div class="field s6"><label>关键词</label><input id="q" value="Hadoop 运维"></div><div class="field s3"><label>地点</label><input id="loc" value="Shanghai, China"></div><div class="field s3"><label>最近天数</label><input id="age" type="number" value="14" min="1" max="365"></div></div><button id="search" class="btn primary">开始搜索</button><div id="searchMsg" class="notice"></div><div id="jobs"></div></div></section>
    <section id="page-apply" class="page" hidden><div class="grid"><div class="card half"><h2>岗位信息</h2><div class="row"><div class="field s6"><label>公司</label><input id="company"></div><div class="field s6"><label>岗位</label><input id="role"></div><div class="field s6"><label>部门（可选）</label><input id="department"></div><div class="field s6"><label>地点（可选）</label><input id="jobLocation"></div><div class="field s12"><label>岗位链接（可选）</label><input id="url"></div></div><div class="field"><label>完整 JD（链接抓取失败时必须粘贴）</label><textarea id="jd"></textarea></div><div class="actions"><button id="evaluate" class="btn primary">第 1 步：评估匹配度</button><button id="confirm" class="btn good" disabled>确认并执行完整 /apply</button></div><div id="applyMsg" class="notice"></div></div><div class="card half"><h2>评估与最终报告</h2><pre id="output">先提交岗位进行匹配度评估。评估后由你明确确认，系统才会继续生成材料。</pre></div><div class="card half"><h2>执行进度</h2><div id="steps" class="steps"><div class="notice">尚未创建任务。</div></div></div><div class="card half"><h2>下载文件</h2><div id="artifacts" class="notice">任务完成后可下载 CV、求职信、核验报告和 ZIP。</div></div></div></section>
    <section id="page-history" class="page" hidden><div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">历史记录</h2><button id="refreshHistory" class="btn">刷新</button></div><div id="history"></div></div></section>
  </main>
</div>
<script>
const state={auth:sessionStorage.getItem('jobSearchAuth')||'',applyId:null,poll:null};
const pageInfo={profile:['候选人档案','编辑并保存用于所有匹配和申请的真实资料。'],search:['岗位搜索','调用现有 LinkedIn / FreeHire CLI 搜索并去重。'],apply:['完整 /apply','评估后确认，依次执行初稿、复审、修订、PDF 检查和 ATS 核验。'],history:['历史记录','查看搜索、评估和既有生成记录。']};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=v=>JSON.stringify(v,null,2);
function headers(json=true){return {...(json?{'Content-Type':'application/json'}:{}),...(state.auth?{Authorization:`Basic ${state.auth}`}:{})}}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(true),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){showLogin('登录失效，请重新登录。');throw new Error(d.detail||'未授权')}if(!r.ok)throw new Error(d.detail||pretty(d));return d}
function busy(btn,on,text='处理中…'){btn.dataset.old??=btn.textContent;btn.disabled=on;btn.textContent=on?text:btn.dataset.old}function msg(el,text,kind=''){el.textContent=text||'';el.className=`notice ${kind}`}
function showLogin(text=''){$('login').style.display='grid';$('loginMsg').textContent=text}function hideLogin(){$('login').style.display='none'}
async function config(){const d=await api('/api/config');$('sys').innerHTML=`模型：${esc(d.model_name||'未配置')}<br>AI：${d.model_configured?'已配置':'未配置'}<br>岗位源：${esc((d.job_sources||[]).join(' / '))}`}
async function loadProfile(){const d=await api('/api/profile');$('profileText').value=d.content||''}
$('loginForm').onsubmit=async e=>{e.preventDefault();state.auth=btoa(unescape(encodeURIComponent(`${$('loginUser').value}:${$('loginPass').value}`)));try{await config();sessionStorage.setItem('jobSearchAuth',state.auth);hideLogin();await loadProfile()}catch(err){state.auth='';$('loginMsg').textContent=err.message}};
$('logout').onclick=()=>{sessionStorage.removeItem('jobSearchAuth');state.auth='';showLogin()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=async()=>{const p=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!==`page-${p}`);$('pageTitle').textContent=pageInfo[p][0];$('pageSub').textContent=pageInfo[p][1];if(p==='history')await loadHistory()});
$('saveProfile').onclick=async e=>{busy(e.currentTarget,true);try{await api('/api/profile',{method:'PUT',body:JSON.stringify({content:$('profileText').value})});msg($('profileMsg'),'档案已保存。','success')}catch(err){msg($('profileMsg'),err.message,'error')}finally{busy(e.currentTarget,false)}};
$('importProfile').onclick=async e=>{busy(e.currentTarget,true);try{const d=await api('/api/profile/import-local',{method:'POST'});$('profileText').value=d.content;msg($('profileMsg'),`已从 ${d.source} 导入。`,'success')}catch(err){msg($('profileMsg'),err.message,'error')}finally{busy(e.currentTarget,false)}};
$('search').onclick=async e=>{const btn=e.currentTarget;busy(btn,true,'搜索中…');$('jobs').innerHTML='';try{const d=await api('/api/jobs/search',{method:'POST',body:JSON.stringify({query:$('q').value,location:$('loc').value,jobage:Number($('age').value||14),limit:20})});msg($('searchMsg'),`找到 ${d.count} 个岗位。${d.errors?.length?' 部分来源失败。':''}`,d.count?'success':'');$('jobs').innerHTML=(d.results||[]).map((j,i)=>`<div class="job"><div class="jobtop"><div><div class="title">${esc(j.title||'未命名岗位')}</div><div class="meta">${esc(j.company||'未知公司')} · ${esc(j.location||'地点未知')} · ${esc(j.date||'日期未知')}</div></div><span class="muted">${esc(j.source||'')}</span></div><div class="actions" style="margin-top:10px">${j.url?`<a class="btn" href="${esc(j.url)}" target="_blank" rel="noreferrer">打开岗位</a>`:''}<button class="btn" data-use="${i}">转到完整 /apply</button></div></div>`).join('')+(d.errors||[]).map(x=>`<div class="error">${esc(x.source)}：${esc(x.error)}</div>`).join('');document.querySelectorAll('[data-use]').forEach(x=>x.onclick=()=>{const j=d.results[Number(x.dataset.use)];$('company').value=j.company||'';$('role').value=j.title||'';$('jobLocation').value=j.location||'';$('url').value=j.url||'';$('jd').value=j.description||'';document.querySelector('[data-page="apply"]').click()})}catch(err){msg($('searchMsg'),err.message,'error')}finally{busy(btn,false)}};
function payload(){return{company:$('company').value,title:$('role').value,department:$('department').value,location:$('jobLocation').value,url:$('url').value,description:$('jd').value,language:'auto'}}
$('evaluate').onclick=async e=>{const btn=e.currentTarget;busy(btn,true,'评估中…');$('confirm').disabled=true;stopPoll();try{const d=await api('/api/full-apply/evaluate',{method:'POST',body:JSON.stringify(payload())});state.applyId=d.id;$('output').textContent=pretty(d.evaluation);renderSteps(d.steps);msg($('applyMsg'),`评估完成，任务编号 ${d.id}。请确认是否继续。`,'success');$('confirm').disabled=false}catch(err){msg($('applyMsg'),err.message,'error');$('output').textContent=err.message}finally{busy(btn,false)}};
$('confirm').onclick=async e=>{if(!state.applyId)return;const btn=e.currentTarget;busy(btn,true,'启动中…');try{const d=await api(`/api/full-apply/${state.applyId}/confirm`,{method:'POST'});renderApply(d);msg($('applyMsg'),'完整 /apply 已进入后台执行。可以保持本页打开查看进度。','success');startPoll()}catch(err){msg($('applyMsg'),err.message,'error');busy(btn,false)}};
function renderSteps(steps=[]){$('steps').innerHTML=steps.map(s=>`<div class="step ${esc(s.status)}"><span class="dot"></span><div><div class="title">${esc(s.label)}</div><div class="meta">${esc(s.status)}${s.message?` · ${esc(s.message)}`:''}</div></div></div>`).join('')||'<div class="notice">尚无步骤。</div>'}
function renderApply(d){renderSteps(d.steps||[]);if(d.status==='awaiting_confirmation'){$('output').textContent=pretty(d.evaluation);$('confirm').disabled=false}else if(d.status==='completed'){$('output').textContent=pretty(d.result);$('confirm').disabled=true;msg($('applyMsg'),'完整 /apply 已完成。','success')}else if(d.status==='failed'){$('output').textContent=pretty({error:d.error,result:d.result});$('confirm').disabled=false;msg($('applyMsg'),d.error||'任务失败','error')}else{$('output').textContent=pretty({status:d.status,current_step:d.current_step,evaluation:d.evaluation});$('confirm').disabled=true}renderArtifacts(d.artifacts||[],d.id)}
function renderArtifacts(items,id){$('artifacts').innerHTML=items.length?items.map(x=>`<div class="artifact"><div><div>${esc(x.name)}</div><div class="meta">${Math.ceil(x.size/1024)} KB</div></div><button class="btn" data-download="${esc(x.name)}">下载</button></div>`).join(''):'<div class="notice">暂无可下载文件。</div>';document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(id,b.dataset.download))}
async function downloadFile(id,name){const r=await fetch(`/api/full-apply/${id}/download/${encodeURI(name)}`,{headers:headers(false)});if(!r.ok){alert('下载失败');return}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function startPoll(){stopPoll();state.poll=setInterval(poll,2000);poll()}function stopPoll(){if(state.poll)clearInterval(state.poll);state.poll=null}async function poll(){if(!state.applyId)return;try{const d=await api(`/api/full-apply/${state.applyId}`);renderApply(d);if(['completed','failed'].includes(d.status)){stopPoll();busy($('confirm'),false);$('confirm').disabled=d.status==='completed'}}catch(err){stopPoll();msg($('applyMsg'),err.message,'error')}}
async function loadHistory(){const d=await api('/api/history');$('history').innerHTML=(d.items||[]).map(x=>`<div class="history"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.kind)} · ${esc(x.created_at)}</div><details><summary>查看</summary><pre>${esc(pretty(x.result))}</pre></details></div>`).join('')||'<div class="notice">暂无记录。</div>'}
$('refreshHistory').onclick=loadHistory;
(async()=>{if(!state.auth)return showLogin();try{await config();await loadProfile();hideLogin()}catch(err){showLogin(err.message)}})();
</script>
</body>
</html>
